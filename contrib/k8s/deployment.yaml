# As a non-root user, read-only root filesystem, no capabilities (PSS restricted).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-throwaway
  labels:
    app.kubernetes.io/name: e2e-throwaway
    app.kubernetes.io/component: server
spec:
  replicas: 1
  # State is on an emptyDir: swap it for a PersistentVolumeClaim (and keep
  # Recreate, so there are never two writers) if it must survive the pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: e2e-throwaway
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e2e-throwaway
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: e2e-throwaway
          image: ghcr.io/metalayerlab/e2e-throwaway
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: TZ, value: "Europe/London"}
            - {name: E2E_THROWAWAY_CONFIG, value: /etc/e2e-throwaway/config.yaml}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/e2e-throwaway, readOnly: true}
            - {name: state, mountPath: /var/lib/e2e-throwaway}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: e2e-throwaway-config}
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
