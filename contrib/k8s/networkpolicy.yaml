# Default: only the ingress controller (the traefik namespace) may reach it.
# Add a podSelector/namespaceSelector here for each in-cluster client.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: e2e-throwaway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: e2e-throwaway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - {port: 8080, protocol: TCP}
