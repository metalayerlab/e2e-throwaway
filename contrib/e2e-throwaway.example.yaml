# e2e-throwaway configuration: every setting, with its default.
#
# Copy to /etc/e2e-throwaway/config.yaml (or point E2E_THROWAWAY_CONFIG / --config
# at it). Every key can also be set as an environment variable,
# E2E_THROWAWAY_<KEY> (dots become underscores), or read from a file with
# E2E_THROWAWAY_<KEY>_FILE. Secrets belong in _FILE, never in this file.
# Full reference: the wiki's In-Depth-Configuration page.

# DEBUG, INFO, WARNING or ERROR
log_level: INFO

listen:
  host: 0.0.0.0
  port: 8080

# Persistent state
state_dir: /var/lib/e2e-throwaway
